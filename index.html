<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">

<title>TH &amp; THCS PHƯỚC AN – SAO ĐỎ</title>
<style>
:root{--bg:#0b1220;--card:#162033;--card2:#1e293b;--text:#f8fafc;--muted:#94a3b8;--primary:#3b82f6;--primary2:#2563eb;--success:#22c55e;--danger:#ef4444;--warning:#f59e0b;--border:#334155;--shadow:0 12px 35px rgba(0,0,0,.25)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}
body{min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.55;transform:none!important;filter:none!important}.hidden{display:none!important}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}
#login{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at top,#2563eb,#0f172a 65%);padding:20px}
.login-box{width:min(430px,100%);background:rgba(15,23,42,.94);border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:30px;box-shadow:var(--shadow);text-align:center;backdrop-filter:blur(12px)}
.logo{font-size:46px}.login-box h1{margin:8px 0;font-size:22px}.login-box p{color:#cbd5e1}.login-box label{display:block;text-align:left;margin-top:12px;color:#cbd5e1;font-size:14px}
#pin,#pinConfirm{width:100%;padding:14px;border-radius:12px;border:1px solid var(--border);background:#0f172a;color:#fff;text-align:center;font-size:20px;margin-top:7px;letter-spacing:.18em}
#loginMsg{min-height:24px;margin:10px 0 0}.login-actions{display:grid;gap:9px;margin-top:14px}
#app{max-width:1500px;margin:auto;padding:16px}.topbar{display:flex;gap:15px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}.brand h2{margin:0}.brand small{color:var(--muted)}.menu{display:flex;gap:7px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:10px 13px;color:#fff;background:var(--primary);font-weight:700;transition:filter .15s,transform .15s,box-shadow .15s}.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}.btn:active{transform:translateY(1px);filter:brightness(.94)}.btn.secondary{background:#475569}.btn.success{background:var(--success);color:#052e16}.btn.danger{background:var(--danger)}.btn.warning{background:var(--warning);color:#111827}.btn.ghost{background:transparent;border:1px solid var(--border)}.btn.small{padding:7px 10px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}.stat{background:var(--card);border:1px solid var(--border);border-radius:15px;padding:16px;box-shadow:var(--shadow);min-width:0}.stat b{display:block;font-size:25px;margin-top:5px;overflow-wrap:anywhere}.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:15px;box-shadow:var(--shadow);animation:fade .18s ease-out}.card .card{box-shadow:none}.section{display:none}.section.active{display:block}.rank-title{font-size:22px;font-weight:800;color:#60a5fa;margin-bottom:12px}.rank-1{font-weight:800;color:#f59e0b}.plus{color:var(--success);font-weight:700}.minus{color:var(--danger);font-weight:700}
@keyframes fade{from{opacity:.35;transform:translateY(4px)}to{opacity:1;transform:none}}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.toolbar input,.toolbar select,.form-control,textarea.form-control{background:#0f172a;color:#fff;border:1px solid var(--border);border-radius:9px;padding:10px}.toolbar input::placeholder,.rule input::placeholder{color:#94a3b8}.table-wrap{overflow:auto;max-width:100%;border-radius:9px}table{width:100%;border-collapse:collapse;min-width:650px}th,td{border:1px solid var(--border);padding:9px;text-align:center}th{background:#0f172a;position:sticky;top:0;z-index:1}tbody tr:hover td{background:rgba(255,255,255,.035)}td.text-left{text-align:left}.medal{font-size:18px;white-space:nowrap}
.notice{padding:11px 12px;border-radius:10px;background:#0f172a;border:1px solid var(--border);margin:8px 0}.notice.danger-notice{border-color:#7f1d1d;background:#2a121a;color:#fecaca}.notice.success-notice{border-color:#14532d;color:#bbf7d0}.danger-text{color:#fca5a5}.success-text{color:#86efac}.empty{text-align:center;padding:22px;color:var(--muted)}.toolbar-spacer{flex:1}
.score-layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:15px;align-items:start}.rule-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.rule{background:#0f172a;border:1px solid var(--border);border-radius:10px;padding:10px;min-width:0}.rule strong{display:block;margin-bottom:7px;line-height:1.4}.rule .row{display:grid;grid-template-columns:minmax(0,1fr) 82px 34px;gap:7px;align-items:center}.student-entries{display:grid;gap:7px}.student-entry .remove-student{width:34px;height:34px;padding:0}.add-student{margin-top:7px;padding:6px 9px;font-size:12px}.rule input{width:100%;min-width:0;padding:8px;background:#162033;color:#fff;border:1px solid var(--border);border-radius:7px}.rule input[type=number]{text-align:center}.rule .muted{font-size:13px;margin-top:7px}.total-box{position:sticky;top:12px;height:max-content}.big-score{font-size:42px;font-weight:900;margin:8px 0;line-height:1.1}.score-total-card{padding:18px}.score-total-card hr{border:0;border-top:1px solid var(--border);margin:14px 0}.score-note{font-size:13px;line-height:1.5}.draft-indicator{font-size:13px;color:#fde68a;min-height:20px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:5000;overflow:auto;padding:18px}.modal-content{max-width:1100px;margin:24px auto;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:20px;position:relative;min-height:160px}.close{position:absolute;right:14px;top:8px;font-size:28px;background:none;border:0;color:#fff}.modal-content h2{padding-right:38px}.toast{position:fixed;right:18px;bottom:18px;z-index:10000;max-width:min(420px,calc(100vw - 36px))}.toast-item{margin-top:8px;background:#0f172a;border:1px solid var(--border);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.tool-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tool-card p{line-height:1.5}.inline-form{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pin-change-grid{display:grid;gap:10px;max-width:440px}.pin-change-grid input{background:#0f172a;color:#fff;border:1px solid var(--border);border-radius:9px;padding:11px}.footer-note{font-size:12px;color:var(--muted);margin-top:12px}.data-banner{margin:0 0 12px}.data-banner .btn{margin-top:8px}
@media(max-width:1000px){.score-layout{grid-template-columns:1fr}.total-box{position:static}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){#app{padding:10px}.topbar{align-items:stretch}.brand{width:100%}.menu .btn{flex:1 1 30%;padding:9px 8px;font-size:13px}.rule-list{grid-template-columns:1fr}.tool-grid{grid-template-columns:1fr}.card{padding:13px}.modal{padding:9px}.modal-content{margin:12px auto;padding:16px}.rank-title{font-size:19px}.toolbar input{flex:1 1 190px}}
@media(max-width:420px){.grid{gap:8px}.stat{padding:11px}.stat b{font-size:20px}.menu .btn{flex:1 1 44%}.rule .row{grid-template-columns:minmax(0,1fr) 66px 30px}.rule .remove-student{width:30px;height:32px;padding:0}.big-score{font-size:36px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="login" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
  <div class="login-box">
    <div class="logo" aria-hidden="true">⭐</div>
    <h1 id="loginTitle">SAO ĐỎ PHƯỚC AN</h1>
    <p id="loginSubtitle">Hệ thống chấm điểm &amp; xếp hạng nề nếp</p>
    <form id="loginForm" novalidate>
      <label id="pinLabel" for="pin">Mã PIN</label>
      <input id="pin" type="password" inputmode="numeric" maxlength="12" autocomplete="current-password" placeholder="Nhập PIN" required>
      <div id="pinConfirmWrap" class="hidden"><label for="pinConfirm">Nhập lại PIN mới</label><input id="pinConfirm" type="password" inputmode="numeric" maxlength="12" autocomplete="new-password" placeholder="Xác nhận PIN"></div>
      <div class="login-actions"><button id="loginSubmit" class="btn success" type="submit">Mở hệ thống</button></div>
    </form>
    <p id="loginMsg" class="danger-text" aria-live="polite"></p>
    <p class="footer-note">PIN chỉ khóa giao diện trên thiết bị này; không thay thế tài khoản và bảo mật phía máy chủ.</p>
  </div>
</div>

<div id="app" class="hidden">
  <header class="topbar">
    <div class="brand"><h2>TH &amp; THCS PHƯỚC AN</h2><small>ĐỘI SAO ĐỎ • Quản lý nề nếp học sinh</small></div>
    <nav class="menu" aria-label="Điều hướng chính">
      <button class="btn" data-section="week">BXH Tuần</button><button class="btn" data-section="month">BXH Tháng</button><button class="btn" data-section="year">BXH Năm</button><button class="btn success" data-section="score">Chấm điểm</button><button class="btn secondary" data-section="tools">Tiện ích</button><button id="logoutBtn" class="btn secondary" data-action="logout">Khóa</button>
    </nav>
  </header>
  <div id="dataAlert" class="data-banner" aria-live="polite"></div>
  <div id="stats" class="grid" aria-live="polite"></div>
  <section id="week" class="section active card" aria-labelledby="weekHeading"></section>
  <section id="month" class="section card" aria-labelledby="monthHeading"></section>
  <section id="year" class="section card" aria-labelledby="yearHeading"></section>
  <section id="score" class="section card" aria-labelledby="scoreHeading"></section>
  <section id="tools" class="section card" aria-labelledby="toolsHeading"></section>
</div>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-content"><button id="closeModalBtn" class="close" type="button" data-action="close-modal" aria-label="Đóng">&times;</button><h2 id="modalTitle"></h2><div id="modalBody"></div></div>
</div>
<div id="toast" class="toast" aria-live="polite" aria-atomic="true"></div>
<input id="restoreFile" class="hidden" type="file" accept=".json,application/json" aria-label="Chọn tệp sao lưu JSON">

<script>
"use strict";

const PIN_RECORD_KEY = "PHUOCAN_SAODO_PIN_V2";
const STORAGE_KEY = "PHUOCAN_SAODO_DATA_V2";
const LEGACY_KEYS = ["PHUOCAN_SAODO_STABLE_V1", "PHUOCAN_DB"];
const APP_FORMAT = "PHUOCAN_SAODO_BACKUP";
const SCHEMA_VERSION = 2;
const LOPS = ["6A","6B","6C","6D","7A","7B","7C","7D","8A","8B","8C","9A","9B"];
const LOIS = [
  {n:"Khăn quàng/Huy hiệu",d:-5},{n:"Đồng phục/Bỏ áo vào quần",d:-5},{n:"Đi trễ",d:-2},{n:"Vắng không phép",d:-5},
  {n:"Nói tục/Chửi thề",d:-10},{n:"Đánh nhau",d:-50},{n:"Xả rác/Vệ sinh",d:-20},{n:"Trực nhật bẩn",d:-10},
  {n:"Không thuộc bài",d:-10},{n:"Điểm 7",d:5},{n:"Điểm 8-9",d:7},{n:"Điểm 10",d:10},{n:"Phong trào",d:10}
];
const $ = id => document.getElementById(id);
let loadIssue = null;
let lastPersistedRaw = null;
let sourceLegacyKey = null;
let DB = loadDB();
let selectedScoreClass = LOPS[0];
let currentClass = "";
let currentHistoryTab = "sessions";
let currentHistoryDetail = null;
let weeklyArchiveState = {level:"weeks",weekId:null,className:null,ruleIndex:null,sessionId:null};
let pinBusy = false;
let saveBusy = false;
let pinMode = "login";

function isObject(v){return !!v && typeof v === "object" && !Array.isArray(v)}
function deepClone(value){return typeof structuredClone === "function" ? structuredClone(value) : JSON.parse(JSON.stringify(value))}
function safeNumber(value,fallback=0){if(value===null||value===undefined||value==="")return fallback;const n=Number(value);return Number.isFinite(n)?n:fallback}
function newId(prefix="id"){const c=window.crypto;const u=c&&typeof c.randomUUID==="function"?c.randomUUID():Date.now().toString(36)+"_"+Math.random().toString(36).slice(2)+"_"+Math.random().toString(36).slice(2);return prefix+"_"+u}
function localDateTime(date=new Date()){return new Intl.DateTimeFormat("vi-VN",{dateStyle:"short",timeStyle:"short"}).format(date)}
function localDate(date=new Date()){return new Intl.DateTimeFormat("sv-SE").format(date)}
function dateStamp(){return localDate().replaceAll("-","")}
function displayDate(value){if(!value)return "—";const d=new Date(value);return Number.isNaN(d.getTime())?String(value):localDateTime(d)}
function escapeHTML(value){return String(value??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch]))}
function csvCell(value){let s=String(value??"");if(typeof value==="string"&&/^[\s]*[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"'}
function newClass(total=100){return {total}}
function defaultDB(){const classes={};LOPS.forEach(l=>classes[l]=newClass());return {schemaVersion:SCHEMA_VERSION,revision:0,updatedAt:null,meta:{closedWeeksTotal:0,monthsCreatedTotal:0,yearsCreatedTotal:0},activeWeek:{id:"week_1",number:1,startedAt:new Date().toISOString()},classes,sessions:[],weeks:[],months:[],years:[],legacy:null}}

function migrateClass(raw){const c=isObject(raw)?raw:{};const score=safeNumber(c.total,100);return newClass(score)}
function migrateLegacy(parsed,sourceKey){
  if(!isObject(parsed))throw new Error("Cấu trúc dữ liệu cũ không phải một đối tượng JSON.");
  const root=isObject(parsed.data)?parsed.data:parsed;
  const oldClasses=isObject(root.classes)?root.classes:root;
  const out=defaultDB();
  for(const l of LOPS)out.classes[l]=migrateClass(oldClasses[l]);
  out.legacy={sourceKey:sourceKey||"tệp JSON",importedAt:new Date().toISOString(),original:deepClone(parsed)};
  return out;
}
function validateScoreMap(map,label){if(!isObject(map))throw new Error(label+": thiếu bảng điểm.");for(const l of LOPS){if(!Object.prototype.hasOwnProperty.call(map,l)||!Number.isFinite(Number(map[l])))throw new Error(label+": điểm lớp "+l+" không hợp lệ.")}}
function validateDB(candidate){
  if(!isObject(candidate)||candidate.schemaVersion!==SCHEMA_VERSION)throw new Error("Phiên bản cấu trúc dữ liệu không được hỗ trợ.");
  if(!isObject(candidate.meta)||!Number.isInteger(candidate.meta.closedWeeksTotal)||candidate.meta.closedWeeksTotal<0||!Number.isInteger(candidate.meta.monthsCreatedTotal)||candidate.meta.monthsCreatedTotal<0||!Number.isInteger(candidate.meta.yearsCreatedTotal)||candidate.meta.yearsCreatedTotal<0)throw new Error("Bộ đếm kỳ không hợp lệ.");
  if(!isObject(candidate.activeWeek)||typeof candidate.activeWeek.id!=="string"||!candidate.activeWeek.id||candidate.activeWeek.number!==candidate.meta.closedWeeksTotal+1)throw new Error("Kỳ tuần hiện tại không hợp lệ.");
  if(!isObject(candidate.classes))throw new Error("Thiếu dữ liệu các lớp.");
  for(const l of LOPS){if(!isObject(candidate.classes[l])||!Number.isFinite(Number(candidate.classes[l].total)))throw new Error("Điểm lớp "+l+" không hợp lệ.")}
  for(const key of ["sessions","weeks","months","years"]){if(!Array.isArray(candidate[key]))throw new Error("Danh sách "+key+" không hợp lệ.")}
  const ids=new Set(),sessionById=new Map();
  for(const session of candidate.sessions){if(!isObject(session)||typeof session.id!=="string"||!session.id||ids.has("s:"+session.id))throw new Error("ID phiên chấm bị thiếu hoặc trùng.");ids.add("s:"+session.id);if(!LOPS.includes(session.className)||typeof session.periodId!=="string"||!session.periodId||!Number.isFinite(Number(session.delta))||!Array.isArray(session.details))throw new Error("Phiên chấm có dữ liệu không hợp lệ.");for(const detail of session.details){if(!isObject(detail)||!Number.isInteger(Number(detail.count))||Number(detail.count)<0||!Number.isFinite(Number(detail.point)))throw new Error("Chi tiết phiên chấm không hợp lệ.")}sessionById.set(session.id,session)}
  const snapshotPeriods=new Set(),linkedSessions=new Set();
  for(const week of candidate.weeks){
    if(!isObject(week)||typeof week.id!=="string"||!week.id||ids.has("w:"+week.id))throw new Error("ID tuần bị thiếu hoặc trùng.");ids.add("w:"+week.id);validateScoreMap(week.scores,"Tuần");
    if(typeof week.activePeriodId!=="string"||!week.activePeriodId||snapshotPeriods.has(week.activePeriodId)||!Array.isArray(week.sessionIds))throw new Error("Liên kết kỳ hoặc danh sách phiên của tuần không hợp lệ.");snapshotPeriods.add(week.activePeriodId);
    const refs=new Set();for(const sessionId of week.sessionIds){if(typeof sessionId!=="string"||!sessionId||refs.has(sessionId))throw new Error("Tuần chứa ID phiên trùng hoặc không hợp lệ.");const session=sessionById.get(sessionId);if(!session||session.periodId!==week.activePeriodId||linkedSessions.has(sessionId))throw new Error("ID phiên không tồn tại hoặc thuộc kỳ tuần khác.");refs.add(sessionId);linkedSessions.add(sessionId)}
    const periodSessions=candidate.sessions.filter(session=>session.periodId===week.activePeriodId);if(periodSessions.length!==refs.size||periodSessions.some(session=>!refs.has(session.id)))throw new Error("Ảnh chụp tuần chưa tham chiếu đầy đủ mọi phiên thuộc kỳ.");
  }
  for(const month of candidate.months){if(!isObject(month)||typeof month.id!=="string"||!month.id||ids.has("m:"+month.id)||!Array.isArray(month.weeks)||month.weeks.length!==4)throw new Error("Kỳ tháng không hợp lệ.");ids.add("m:"+month.id);validateScoreMap(month.scores,"Tháng")}
  for(const year of candidate.years){if(!isObject(year)||typeof year.id!=="string"||!year.id||ids.has("y:"+year.id)||!Array.isArray(year.months)||year.months.length!==12)throw new Error("Kỳ năm không hợp lệ.");ids.add("y:"+year.id);validateScoreMap(year.scores,"Năm")}
  return true;
}
function loadDB(){
  let storage;
  try{storage=window.localStorage}catch(e){loadIssue={type:"storage",message:"Trình duyệt không cho phép truy cập localStorage. Dữ liệu chưa được đọc hoặc lưu."};return defaultDB()}
  try{
    const current=storage.getItem(STORAGE_KEY);lastPersistedRaw=current;
    if(current!==null){try{const parsed=JSON.parse(current);validateDB(parsed);return parsed}catch(e){loadIssue={type:"corrupt",message:"Dữ liệu phiên bản mới bị lỗi hoặc không hợp lệ. Bản lưu hiện tại chưa bị ghi đè.",raw:current};return defaultDB()}}
    for(const key of LEGACY_KEYS){const raw=storage.getItem(key);if(raw===null)continue;sourceLegacyKey=key;try{return migrateLegacy(JSON.parse(raw),key)}catch(e){loadIssue={type:"corrupt",message:"Không thể đọc dữ liệu cũ trong “"+key+"”. Bản gốc vẫn còn nguyên; hãy khôi phục từ tệp sao lưu JSON.",raw};return defaultDB()}}
    return defaultDB();
  }catch(e){loadIssue={type:"storage",message:"Không thể đọc dữ liệu trình duyệt. Hãy kiểm tra quyền lưu trữ trước khi tiếp tục."};return defaultDB()}
}
function persist(candidate,{recovery=false}={}){
  try{
    if(loadIssue&&!recovery)throw new Error("Đang khóa ghi dữ liệu để tránh ghi đè bản lỗi. Hãy khôi phục JSON hợp lệ trước.");
    const storage=window.localStorage;
    const now=storage.getItem(STORAGE_KEY);
    if(now!==lastPersistedRaw)throw new Error("Dữ liệu đã thay đổi trong một thẻ khác. Không ghi đè để tránh mất dữ liệu; hãy tải lại trang và kiểm tra bản mới nhất.");
    validateDB(candidate);
    const raw=JSON.stringify(candidate);
    storage.setItem(STORAGE_KEY,raw);
    if(storage.getItem(STORAGE_KEY)!==raw)throw new Error("Không xác nhận được dữ liệu sau khi ghi.");
    lastPersistedRaw=raw;return true;
  }catch(e){if(String(e.message).includes("thẻ khác"))loadIssue={type:"conflict",message:e.message};toast(e.message||"Không thể lưu dữ liệu vào trình duyệt.","danger");return false}
}
function saveAndRender(candidate=DB,options={}){if(!persist(candidate,options))return false;DB=candidate;loadIssue=null;renderAll();return true}
function cloneForUpdate(){const next=deepClone(DB);next.revision=(Number(DB.revision)||0)+1;next.updatedAt=new Date().toISOString();return next}
function toast(message,type="ok"){const box=document.createElement("div");box.className="toast-item "+(type==="danger"?"danger-text":"success-text");box.textContent=String(message);$("toast").appendChild(box);window.setTimeout(()=>box.remove(),3600)}
function canWrite(){return !loadIssue}

function rankClasses(scoreMap){return [...LOPS].sort((a,b)=>safeNumber(scoreMap[b],0)-safeNumber(scoreMap[a],0)||LOPS.indexOf(a)-LOPS.indexOf(b))}
function medals(index){return index===0?"🥇":index===1?"🥈":index===2?"🥉":""}
function currentWeekKey(date=new Date()){
  const d=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()));const day=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-day);const yearStart=new Date(Date.UTC(d.getUTCFullYear(),0,1));const week=Math.ceil((((d-yearStart)/86400000)+1)/7);return d.getUTCFullYear()+"-W"+String(week).padStart(2,"0");
}

function renderTools(){
  const count=DB.sessions.length;const state=loadIssue?'<span class="danger-text">Chưa xác nhận an toàn</span>':'<span class="success-text">Đang hoạt động</span>';
  $("tools").innerHTML='<div class="rank-title" id="toolsHeading">🧰 Trung tâm quản trị &amp; Tiện ích</div><div class="tool-grid"><div class="stat tool-card"><b>💾 Sao lưu dữ liệu</b><p class="muted">Tải toàn bộ dữ liệu mới và hồ sơ cũ đã chuyển đổi thành tệp JSON.</p><button class="btn success" data-action="backup-json" '+(!canWrite()?'disabled':'')+'>Tải file sao lưu (.JSON)</button></div><div class="stat tool-card"><b>📥 Khôi phục dữ liệu</b><p class="muted">Kiểm tra cấu trúc trước khi xác nhận ghi đè dữ liệu hiện tại.</p><button class="btn secondary" data-action="choose-restore">Chọn tệp JSON</button><p class="footer-note">Hỗ trợ tệp sao lưu của phiên bản này và cấu trúc cũ TH &amp; THCS PHƯỚC AN.</p></div><div class="stat tool-card"><b>📊 Xuất báo cáo Excel</b><p class="muted">Xuất bảng tổng hợp, phiên chấm và các kỳ đã chốt ra CSV UTF‑8.</p><button class="btn" data-action="export-all">Xuất CSV toàn bộ</button></div><div class="stat tool-card"><b>🔐 PIN truy cập</b><p class="muted">Đổi mã PIN của giao diện trên thiết bị này. Mã PIN không bảo vệ dữ liệu trước người có quyền truy cập trình duyệt.</p><button class="btn secondary" data-action="change-pin">Đổi PIN</button></div><div class="stat tool-card"><b>🧹 Reset hệ thống</b><p class="muted">Xóa dữ liệu ứng dụng trên trình duyệt này để bắt đầu lại. Hãy tải bản sao lưu trước.</p><button class="btn danger" data-action="reset-all" '+(!canWrite()?'disabled':'')+'>Xóa tất cả dữ liệu</button></div><div class="stat tool-card"><b>🔎 Kiểm tra cấu trúc dữ liệu</b><p class="muted">Lớp: '+LOPS.length+' · Phiên mới: '+count+' · Tuần đã chốt: '+DB.meta.closedWeeksTotal+' · Tháng: '+DB.meta.monthsCreatedTotal+' · Năm: '+DB.meta.yearsCreatedTotal+'</p><p class="muted">Trạng thái lưu trữ: '+state+'</p><button class="btn secondary" data-action="integrity">Kiểm tra toàn vẹn</button></div></div><div class="notice"><b>Lưu ý lưu trữ:</b> Dữ liệu nằm trong localStorage của trình duyệt và thiết bị hiện tại. Hãy sao lưu định kỳ; không có đồng bộ máy chủ. Nếu trình duyệt chặn localStorage, thao tác ghi sẽ bị từ chối và dữ liệu đang có sẽ không bị thay thế.</div>';
}
function renderAll(){renderDataAlert();renderStats();renderRank();renderMonthRank();renderYearRank();if($("score").classList.contains("active"))renderScore();if($("tools").classList.contains("active"))renderTools()}
function showSection(id){if(!["week","month","year","score","tools"].includes(id))return;document.querySelectorAll(".section").forEach(s=>s.classList.toggle("active",s.id===id));document.querySelectorAll("[data-section]").forEach(b=>b.setAttribute("aria-current",b.dataset.section===id?"page":"false"));if(id==="week")renderRank();if(id==="month")renderMonthRank();if(id==="year")renderYearRank();if(id==="score")renderScore();if(id==="tools")renderTools();window.scrollTo({top:0,behavior:"smooth"})}

function downloadBlob(blob,name){const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();window.setTimeout(()=>URL.revokeObjectURL(url),1200)}
function csvDownload(rows,name){const csv="\uFEFF"+rows.map(r=>r.map(csvCell).join(",")).join("\r\n");downloadBlob(new Blob([csv],{type:"text/csv;charset=utf-8"}),name)}
function exportRanking(type){const source=type==="week"?Object.fromEntries(LOPS.map(l=>[l,DB.classes[l].total])):type==="month"?(currentMonth()?.scores||Object.fromEntries(LOPS.map(l=>[l,0]))):(currentYear()?.scores||Object.fromEntries(LOPS.map(l=>[l,0])));const rows=[["Hạng","Lớp","Điểm "+(type==="week"?"tuần":type==="month"?"tháng":"năm")]];rankClasses(source).forEach((l,i)=>rows.push([i+1,l,safeNumber(source[l])]));csvDownload(rows,"BXH_"+type+"_"+dateStamp()+".csv")}
function exportAllCSV(){const rows=[["TỔNG HỢP LỚP"],["Lớp","Điểm tuần hiện tại","Phiên kỳ hiện tại","Kỳ tuần","Điểm tháng gần nhất","Điểm năm gần nhất"]];LOPS.forEach(l=>rows.push([l,DB.classes[l].total,DB.sessions.filter(s=>s.className===l&&s.periodId===DB.activeWeek.id).length,DB.activeWeek.number,currentMonth()?.scores[l]??"",currentYear()?.scores[l]??""]));rows.push([], ["PHIÊN CHẤM"],["ID","Thời gian","Lớp","Kỳ","Điểm trước","Điểm sau","Điểm phiên","Chi tiết"]);DB.sessions.forEach(s=>rows.push([s.id,displayDate(s.savedAt),s.className,s.periodId,s.before,s.after,s.delta,s.details.map(d=>d.rule+" x"+d.count+(d.student?" ("+d.student+")":"")).join("; ")]));rows.push([], ["TUẦN ĐÃ CHỐT"],["ID","Tuần","Tuần lịch","Ngày chốt",...LOPS]);DB.weeks.forEach(w=>rows.push([w.id,w.label,w.weekKey,displayDate(w.closedAt),...LOPS.map(l=>w.scores[l])]));rows.push([], ["THÁNG ĐÃ CHỐT"],["ID","Kỳ","Ngày tạo",...LOPS]);DB.months.forEach(m=>rows.push([m.id,m.label,displayDate(m.createdAt),...LOPS.map(l=>m.scores[l])]));rows.push([], ["NĂM ĐÃ CHỐT"],["ID","Kỳ","Ngày tạo",...LOPS]);DB.years.forEach(y=>rows.push([y.id,y.label,displayDate(y.createdAt),...LOPS.map(l=>y.scores[l])]));csvDownload(rows,"SAODO_PHUOCAN_BaoCao_"+dateStamp()+".csv")}
function backupJSON(){if(!canWrite()){toast("Không thể tạo bản sao hợp lệ khi dữ liệu hiện tại chưa đọc an toàn.","danger");return}const envelope={format:APP_FORMAT,schemaVersion:SCHEMA_VERSION,exportedAt:new Date().toISOString(),data:DB};downloadBlob(new Blob([JSON.stringify(envelope,null,2)],{type:"application/json;charset=utf-8"}),"SAODO_PHUOCAN_Backup_"+dateStamp()+".json")}
function downloadRaw(){if(!loadIssue?.raw){toast("Không có dữ liệu gốc để tải.","danger");return}downloadBlob(new Blob([loadIssue.raw],{type:"application/json;charset=utf-8"}),"SAODO_PHUOCAN_DataRaw_"+dateStamp()+".json")}
function parseRestoreObject(value){if(!isObject(value))throw new Error("Tệp JSON phải chứa một đối tượng.");if(value.format===APP_FORMAT){if(value.schemaVersion!==SCHEMA_VERSION)throw new Error("Phiên bản tệp sao lưu không được hỗ trợ.");validateDB(value.data);return deepClone(value.data)}if(value.schemaVersion===SCHEMA_VERSION){validateDB(value);return deepClone(value)}if(Number.isInteger(value.schemaVersion)&&value.schemaVersion>SCHEMA_VERSION)throw new Error("Tệp được tạo bởi phiên bản mới hơn.");return migrateLegacy(value,"tệp JSON đã khôi phục")}
function restoreJSON(event){const file=event.target.files?.[0];if(!file)return;if(file.size>10*1024*1024){toast("Tệp lớn hơn giới hạn 10 MB.","danger");event.target.value="";return}const reader=new FileReader();reader.onerror=()=>{toast("Không đọc được tệp JSON.","danger");event.target.value=""};reader.onload=()=>{try{const parsed=JSON.parse(String(reader.result||""));const restored=parseRestoreObject(parsed);const ok=window.confirm("Tệp JSON hợp lệ. Khôi phục sẽ thay thế toàn bộ dữ liệu hiện tại trên trình duyệt này. Tiếp tục?");if(!ok)return;restored.revision=(Number(DB.revision)||0)+1;restored.updatedAt=new Date().toISOString();if(saveAndRender(restored,{recovery:true})){toast("Đã khôi phục và lưu dữ liệu thành công.");showSection("week")}}catch(e){window.alert("Không thể khôi phục: "+(e.message||"Tệp JSON không hợp lệ."))}finally{event.target.value=""}};reader.readAsText(file)}
function runIntegrityCheck(){try{validateDB(DB);const ids=new Set();for(const s of DB.sessions){if(ids.has(s.id))throw new Error("Phát hiện ID phiên bị trùng: "+s.id);ids.add(s.id);const sum=s.details.reduce((n,d)=>n+safeNumber(d.point),0);if(sum!==safeNumber(s.delta))throw new Error("Tổng chi tiết không khớp điểm phiên "+s.id)}toast("Toàn vẹn dữ liệu đạt: "+LOPS.length+" lớp, "+DB.sessions.length+" phiên, "+DB.weeks.length+" tuần gần nhất.");window.alert("Kiểm tra hoàn tất. Không phát hiện lỗi cấu trúc hoặc tổng điểm phiên.")}catch(e){toast("Kiểm tra phát hiện lỗi: "+e.message,"danger");window.alert("Dữ liệu có vấn đề: "+e.message)}}
function resetAll(){if(!canWrite()){toast("Không thể reset khi dữ liệu chưa được đọc an toàn.","danger");return}if(!window.confirm("CẢNH BÁO: Xóa toàn bộ phiên, điểm, tuần/tháng/năm và hồ sơ cũ trong ứng dụng này? Hãy chắc chắn đã tải bản sao lưu."))return;if(!window.confirm("Xác nhận lần cuối: dữ liệu đã xóa không thể phục hồi nếu không có file sao lưu. Tiếp tục?"))return;const fresh=defaultDB();fresh.revision=(Number(DB.revision)||0)+1;if(saveAndRender(fresh)){try{LEGACY_KEYS.forEach(k=>localStorage.removeItem(k))}catch(e){toast("Dữ liệu mới đã reset; không xóa được khóa dữ liệu cũ.","danger")}toast("Hệ thống đã được đặt lại.");showSection("week")}}
function makeSalt(){const bytes=new Uint8Array(16);if(window.crypto?.getRandomValues)window.crypto.getRandomValues(bytes);else for(let i=0;i<bytes.length;i++)bytes[i]=Math.floor(Math.random()*256);return Array.from(bytes,b=>b.toString(16).padStart(2,"0")).join("")}
async function hashPin(pin,salt){const input=pin+"|"+salt;if(window.crypto?.subtle&&window.TextEncoder){const bytes=new TextEncoder().encode(input);const digest=await window.crypto.subtle.digest("SHA-256",bytes);return Array.from(new Uint8Array(digest),b=>b.toString(16).padStart(2,"0")).join("")}let h=2166136261;for(let i=0;i<input.length;i++){h^=input.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(16).padStart(8,"0")}
function readPinRecord(){try{const raw=window.localStorage.getItem(PIN_RECORD_KEY);if(!raw)return null;const p=JSON.parse(raw);return isObject(p)&&typeof p.salt==="string"&&typeof p.hash==="string"?p:null}catch(e){return null}}
async function setPin(pin){const salt=makeSalt(),hash=await hashPin(pin,salt);window.localStorage.setItem(PIN_RECORD_KEY,JSON.stringify({salt,hash,updatedAt:new Date().toISOString()}))}
function paintLoginMode(){const record=readPinRecord();pinMode=record?"login":"setup";$("pinConfirmWrap").classList.toggle("hidden",pinMode!=="setup");$("pinLabel").textContent=pinMode==="setup"?"Tạo PIN mới (4–12 chữ số)":"Mã PIN";$("pin").placeholder=pinMode==="setup"?"Tạo PIN mới":"Nhập PIN";$("pin").autocomplete=pinMode==="setup"?"new-password":"current-password";$("loginSubmit").textContent=pinMode==="setup"?"Thiết lập PIN và mở hệ thống":"Mở hệ thống";$("loginSubtitle").textContent=pinMode==="setup"?"Thiết lập PIN riêng cho thiết bị này":"Hệ thống chấm điểm & xếp hạng nề nếp"}
async function handleLogin(event){event.preventDefault();if(pinBusy)return;const pin=$("pin").value;const msg=$("loginMsg");msg.textContent="";if(!/^\d{4,12}$/.test(pin)){msg.textContent="PIN phải gồm từ 4 đến 12 chữ số.";return}pinBusy=true;$("loginSubmit").disabled=true;try{if(pinMode==="setup"){if(pin!==$("pinConfirm").value){msg.textContent="Hai lần nhập PIN chưa khớp.";return}await setPin(pin);unlock();return}const record=readPinRecord();if(!record){paintLoginMode();msg.textContent="Chưa có PIN. Hãy thiết lập PIN mới.";return}const candidate=await hashPin(pin,record.salt);if(candidate!==record.hash){msg.textContent="Mã PIN không đúng.";return}unlock()}catch(e){msg.textContent="Không lưu/xác minh được PIN. Hãy kiểm tra quyền lưu trữ của trình duyệt."}finally{pinBusy=false;$("loginSubmit").disabled=false}}
function unlock(){$("login").classList.add("hidden");$("app").classList.remove("hidden");$("pin").value="";$("pinConfirm").value="";$("loginMsg").textContent="";renderAll()}
function logout(){$("app").classList.add("hidden");$("login").classList.remove("hidden");$("pin").value="";$("pinConfirm").value="";paintLoginMode();$("pin").focus();window.scrollTo(0,0)}
function showChangePin(){if(!readPinRecord()){toast("Hãy thiết lập PIN trước.","danger");return}$("modalTitle").textContent="Đổi mã PIN";$("modalBody").innerHTML='<form id="changePinForm" class="pin-change-grid" novalidate><label for="oldPin">PIN hiện tại</label><input id="oldPin" type="password" inputmode="numeric" maxlength="12" autocomplete="current-password" required><label for="newPin">PIN mới (4–12 chữ số)</label><input id="newPin" type="password" inputmode="numeric" maxlength="12" autocomplete="new-password" required><label for="newPinConfirm">Nhập lại PIN mới</label><input id="newPinConfirm" type="password" inputmode="numeric" maxlength="12" autocomplete="new-password" required><p id="pinChangeMsg" class="danger-text" aria-live="polite"></p><button class="btn success" type="submit">Lưu PIN mới</button></form><p class="footer-note">PIN lưu dưới dạng mã băm ở trình duyệt; việc này không biến ứng dụng tĩnh thành cơ chế bảo mật dữ liệu.</p>';$(("modal")).classList.remove("hidden")}
async function changePin(event){event.preventDefault();const oldPin=$("oldPin").value,newPin=$("newPin").value,confirmPin=$("newPinConfirm").value,msg=$("pinChangeMsg");const record=readPinRecord();if(!record){msg.textContent="Không tìm thấy cấu hình PIN.";return}if(await hashPin(oldPin,record.salt)!==record.hash){msg.textContent="PIN hiện tại không đúng.";return}if(!/^\d{4,12}$/.test(newPin)){msg.textContent="PIN mới phải gồm 4–12 chữ số.";return}if(newPin!==confirmPin){msg.textContent="Hai lần nhập PIN mới chưa khớp.";return}try{await setPin(newPin);closeModal();toast("Đã đổi PIN.")}catch(e){msg.textContent="Không thể lưu PIN mới vào trình duyệt."}}

function handleClick(event){
  const sectionButton=event.target.closest("[data-section]");if(sectionButton){showSection(sectionButton.dataset.section);return}
  const button=event.target.closest("[data-action]");if(!button||button.disabled)return;const action=button.dataset.action;
  if(action==="logout")logout();else if(action==="close-modal")closeModal();else if(action==="open-tools")showSection("tools");else if(action==="reset-score"){renderScore();toast("Đã làm mới phiếu chấm.")}else if(action==="save-session")saveSession();else if(action==="close-week")closeWeek();else if(action==="open-history")openModal(button.dataset.class);else if(action==="open-weekly-archive")openWeeklyArchive();else if(action==="archive-open-week"){weeklyArchiveState={level:"ranking",weekId:button.dataset.id,className:null,ruleIndex:null,sessionId:null};renderWeeklyArchive()}else if(action==="archive-open-class"){weeklyArchiveState={level:"class",weekId:button.dataset.id,className:button.dataset.class,ruleIndex:null,sessionId:null};renderWeeklyArchive()}else if(action==="archive-open-criterion"){weeklyArchiveState={...weeklyArchiveState,level:"detail",ruleIndex:Number(button.dataset.ruleIndex),sessionId:null};renderWeeklyArchive()}else if(action==="archive-open-session"){weeklyArchiveState={...weeklyArchiveState,level:"detail",ruleIndex:null,sessionId:button.dataset.id};renderWeeklyArchive()}else if(action==="archive-back-weeks")archiveBack("weeks");else if(action==="archive-back-ranking")archiveBack("ranking");else if(action==="archive-back-class")archiveBack("class");else if(action==="add-student-row")addStudentRow(button.dataset.ruleIndex);else if(action==="remove-student-row")removeStudentRow(button);else if(action==="history-tab"){currentHistoryTab=button.dataset.tab;currentHistoryDetail=null;renderHistory()}else if(action==="session-detail")showSessionDetail(button.dataset.id);else if(action==="week-detail")showWeekDetail(button.dataset.id);else if(action==="history-back")renderHistory();else if(action==="export-week")exportRanking("week");else if(action==="export-month")exportRanking("month");else if(action==="export-year")exportRanking("year");else if(action==="backup-json")backupJSON();else if(action==="choose-restore")$("restoreFile").click();else if(action==="export-all")exportAllCSV();else if(action==="reset-all")resetAll();else if(action==="integrity")runIntegrityCheck();else if(action==="change-pin")showChangePin();else if(action==="download-raw")downloadRaw();
}
function handleInput(event){const target=event.target;if(target.matches("#weekSearch")){filterTable("weekTable",target.value);return}if(target.matches("#archiveClassSearch")){filterTable("archiveRankTable",target.value);return}if(target.matches("#pin")){ $("loginMsg").textContent="";return}if(target.matches("#pinConfirm")){return}if(target.closest("#scoreForm")&&target.matches(".student-count,.student-name")){const dirty=$("draftIndicator");if(dirty)dirty.textContent="Phiếu có thay đổi chưa lưu";calc()}}
function handleChange(event){const target=event.target;if(target.matches("#lopSelect")){selectedScoreClass=LOPS.includes(target.value)?target.value:LOPS[0];renderScore();return}if(target.matches("#restoreFile")){restoreJSON(event)}}
function filterTable(id,query){const table=$(id);if(!table)return;const term=String(query||"").toLocaleLowerCase("vi");table.querySelectorAll("tbody tr").forEach(row=>row.style.display=row.textContent.toLocaleLowerCase("vi").includes(term)?"":"none")}

$("loginForm").addEventListener("submit",handleLogin);
document.addEventListener("click",handleClick);
document.addEventListener("input",handleInput);
document.addEventListener("change",handleChange);
document.addEventListener("submit",event=>{if(event.target.id==="changePinForm")changePin(event)});
$("modal").addEventListener("click",event=>{if(event.target.id==="modal")closeModal()});
document.addEventListener("keydown",event=>{if(event.key==="Escape"&&!$("modal").classList.contains("hidden"))closeModal()});
window.addEventListener("storage",event=>{
  if(event.key===STORAGE_KEY){if(event.newValue===null){loadIssue={type:"conflict",message:"Dữ liệu đã bị xóa từ một thẻ khác. Thẻ hiện tại vẫn giữ bản trong bộ nhớ nhưng sẽ không ghi đè."};renderAll();return}try{const parsed=JSON.parse(event.newValue);validateDB(parsed);DB=parsed;lastPersistedRaw=event.newValue;loadIssue=null;renderAll();toast("Đã nhận dữ liệu mới từ thẻ trình duyệt khác.")}catch(e){loadIssue={type:"conflict",message:"Một thẻ khác đã ghi dữ liệu không hợp lệ. Thao tác ghi đã bị khóa."};renderAll()}}
  else if(LEGACY_KEYS.includes(event.key)&&event.newValue!==null&&DB.legacy){toast("Dữ liệu của phiên bản cũ vừa thay đổi ở thẻ khác; bản ứng dụng hiện tại không tự trộn để tránh cộng trùng.","danger")}
});
paintLoginMode();renderAll();
</script>
