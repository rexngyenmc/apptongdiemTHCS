<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TH & THCS PHƯỚC AN - SAO ĐỎ | Bản Chuẩn</title>
<style>
:root {
  --bg: #0b1220;
  --card: #162033;
  --card2: #1e293b;
  --text: #f8fafc;
  --muted: #94a3b8;
  --primary: #3b82f6;
  --primary2: #2563eb;
  --success: #22c55e;
  --danger: #ef4444;
  --warning: #f59e0b;
  --border: #334155;
  --shadow: 0 12px 35px rgba(0,0,0,.25);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); color: var(--text); }
body { min-height: 100vh; }
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
.hidden { display: none !important; }

/* LOGIN SCREEN */
#login {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle at top, #2563eb, #0f172a 65%);
  padding: 20px;
}
.login-box {
  width: min(430px, 100%);
  background: rgba(15, 23, 42, 0.92);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 22px;
  padding: 32px;
  box-shadow: var(--shadow);
  text-align: center;
  backdrop-filter: blur(12px);
}
.logo { font-size: 48px; }
.login-box h1 { margin: 8px 0; font-size: 22px; }
.login-box p { color: #cbd5e1; }
#pin {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: #0f172a;
  color: #fff;
  text-align: center;
  font-size: 20px;
  margin-top: 10px;
}
#loginMsg { min-height: 22px; margin: 10px 0 0; }

/* APP LAYOUT */
#app { max-width: 1500px; margin: auto; padding: 16px; }
.topbar {
  display: flex;
  gap: 15px;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  margin-bottom: 14px;
}
.brand h2 { margin: 0; }
.brand small { color: var(--muted); }
.menu { display: flex; gap: 7px; flex-wrap: wrap; }
.btn {
  border: 0;
  border-radius: 10px;
  padding: 10px 13px;
  color: #fff;
  background: var(--primary);
  font-weight: 700;
  transition: 0.15s;
}
.btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
.btn.secondary { background: #475569; }
.btn.success { background: var(--success); }
.btn.danger { background: var(--danger); }
.btn.warning { background: var(--warning); color: #111827; }
.btn.ghost { background: transparent; border: 1px solid var(--border); }

/* STATS GRID */
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 14px; }
.stat { background: var(--card); border: 1px solid var(--border); border-radius: 15px; padding: 16px; box-shadow: var(--shadow); }
.stat b { display: block; font-size: 25px; margin-top: 5px; }
.muted { color: var(--muted); }

/* CONTENT SECTIONS */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 15px;
  box-shadow: var(--shadow);
  animation: fade 0.2s;
}
@keyframes fade {
  from { opacity: 0.2; transform: translateY(5px); }
  to { opacity: 1; transform: none; }
}
.toolbar { display: flex; gap: 9px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.toolbar input, .toolbar select, .form-control {
  background: #0f172a;
  color: #fff;
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 10px;
}
table { width: 100%; border-collapse: collapse; min-width: 650px; }
.table-wrap { overflow: auto; }
th, td { border: 1px solid var(--border); padding: 9px; text-align: center; }
th { background: #0f172a; position: sticky; top: 0; z-index: 1; }
tr:hover td { background: rgba(255, 255, 255, 0.03); }

.rank-title { font-size: 22px; font-weight: 800; color: #60a5fa; margin-bottom: 12px; }
.rank-1 { font-weight: 800; color: #f59e0b; }
.plus { color: var(--success); font-weight: 700; }
.minus { color: var(--danger); font-weight: 700; }
.section { display: none; }
.section.active { display: block; }

/* SCORE FORM */
.score-layout { display: grid; grid-template-columns: 1fr 340px; gap: 15px; }
.rule-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.rule { background: #0f172a; border: 1px solid var(--border); border-radius: 10px; padding: 10px; }
.rule strong { display: block; margin-bottom: 7px; }
.rule .row { display: grid; grid-template-columns: 1fr 90px; gap: 8px; align-items: center; }
.rule input { width: 100%; padding: 8px; background: #162033; color: #fff; border: 1px solid var(--border); border-radius: 7px; }
.total-box { position: sticky; top: 12px; height: max-content; }
.big-score { font-size: 42px; font-weight: 900; margin: 8px 0; }

/* MODAL & TOAST */
.modal { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7); z-index: 5000; overflow: auto; padding: 20px; }
.modal-content { max-width: 1100px; margin: 30px auto; background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 20px; position: relative; }
.close { position: absolute; right: 15px; top: 8px; font-size: 28px; background: none; border: 0; color: #fff; }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.notice { padding: 10px; border-radius: 10px; background: #0f172a; border: 1px solid var(--border); margin: 8px 0; }
.danger-text { color: #fca5a5; }
.success-text { color: #86efac; }
.empty { text-align: center; padding: 22px; color: var(--muted); }
.toast { position: fixed; right: 18px; bottom: 18px; z-index: 10000; max-width: 420px; }
.toast-item { margin-top: 8px; background: #0f172a; border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow); }

@media(max-width:900px){ .grid { grid-template-columns: repeat(2,1fr); } .score-layout { grid-template-columns: 1fr; } .rule-list { grid-template-columns: 1fr; } .total-box { position: static; } }
@media(max-width:600px){ #app { padding: 9px; } .grid { grid-template-columns: 1fr 1fr; } .menu .btn { flex: 1; } .topbar { align-items: stretch; } .brand { width: 100%; } }
</style>
</head>
<body>

<div id="login">
  <div class="login-box">
    <div class="logo">⭐</div>
    <h1>SAO ĐỎ PHƯỚC AN</h1>
    <p>Hệ thống chấm điểm & xếp hạng nề nếp</p>
    <input id="pin" type="password" inputmode="numeric" maxlength="12" placeholder="Nhập PIN đăng nhập" autocomplete="off">
    <p class="muted">Mã PIN mặc định: <b>1234</b></p>
    <div id="loginMsg" class="danger-text"></div>
  </div>
</div>

<div id="app" class="hidden">
  <header class="topbar">
    <div class="brand">
      <h2>TH & THCS PHƯỚC AN</h2>
      <small>ĐỘI SAO ĐỎ • Quản lý nề nếp học sinh</small>
    </div>
    <div class="menu">
      <button class="btn" data-section="week">BXH Tuần</button>
      <button class="btn" data-section="month">BXH Tháng</button>
      <button class="btn" data-section="year">BXH Năm</button>
      <button class="btn success" data-section="score">Chấm điểm</button>
      <button class="btn secondary" data-section="tools">Tiện ích</button>
      <button id="logoutBtn" class="btn secondary">Khóa</button>
    </div>
  </header>

  <div id="stats" class="grid"></div>
  <section id="week" class="section active card"></section>
  <section id="month" class="section card"></section>
  <section id="year" class="section card"></section>
  <section id="score" class="section card"></section>
  <section id="tools" class="section card"></section>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-content">
    <button id="closeModalBtn" class="close">&times;</button>
    <h2 id="modalTitle"></h2>
    <div id="modalBody"></div>
  </div>
</div>
<div id="toast" class="toast"></div>

<script>
"use strict";

const PIN = "1234";
const STORAGE_KEY = "PHUOCAN_SAODO_STABLE_V1";
const LOPS = ["6A","6B","6C","6D","7A","7B","7C","7D","8A","8B","8C","9A","9B"];
const LOIS = [
  { n: "Khăn quàng/Huy hiệu", d: -5 },
  { n: "Đồng phục/Bỏ áo vào quần", d: -5 },
  { n: "Đi trễ", d: -2 },
  { n: "Vắng không phép", d: -5 },
  { n: "Nói tục/Chửi thề", d: -10 },
  { n: "Đánh nhau", d: -50 },
  { n: "Xả rác/Vệ sinh", d: -20 },
  { n: "Trực nhật bẩn", d: -10 },
  { n: "Không thuộc bài", d: -10 },
  { n: "Điểm 7", d: 5 },
  { n: "Điểm 8-9", d: 7 },
  { n: "Điểm 10", d: 10 },
  { n: "Phong trào", d: 10 }
];

function newClass() {
  return {
    total: 100,
    weeks: [],
    months: [],
    years: [],
    monthPoint: 0,
    yearPoint: 0,
    weeksSavedTotal: 0,
    monthsSavedTotal: 0
  };
}

function defaultDB() {
  const db = {};
  LOPS.forEach(l => db[l] = newClass());
  return db;
}

let DB = loadDB();
let selectedScoreClass = LOPS[0];
let currentClass = "";
let currentHistoryTab = "week";

function migrateClass(raw) {
  const c = raw && typeof raw === "object" ? raw : {};
  const out = newClass();
  out.total = Number.isFinite(Number(c.total)) ? Number(c.total) : 100;
  out.monthPoint = Number.isFinite(Number(c.monthPoint)) ? Number(c.monthPoint) : 0;
  out.yearPoint = Number.isFinite(Number(c.yearPoint)) ? Number(c.yearPoint) : 0;
  out.months = Array.isArray(c.months) ? c.months.filter(Boolean) : [];
  out.years = Array.isArray(c.years) ? c.years.filter(Boolean) : [];
  const oldWeeks = Array.isArray(c.weeks) ? c.weeks : [];
  const oldDetails = Array.isArray(c.weekDetails) ? c.weekDetails : [];
  out.weeks = oldWeeks.map((w, i) => {
    const detail = oldDetails[i];
    return {
      id: String(w.id || ("w_" + Date.now() + "_" + i)),
      date: String(w.date || ""),
      score: Number(w.score || 0),
      details: Array.isArray(w.details) ? w.details : (Array.isArray(detail?.details) ? detail.details : [])
    };
  });
  out.weeksSavedTotal = Math.max(Number(c.weeksSavedTotal) || 0, out.weeks.length);
  out.monthsSavedTotal = Math.max(Number(c.monthsSavedTotal) || 0, out.months.length);
  return out;
}

function loadDB() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem("PHUOCAN_DB");
    if (!raw) return defaultDB();
    const parsed = JSON.parse(raw);
    const db = defaultDB();
    LOPS.forEach(l => db[l] = migrateClass(parsed?.[l]));
    return db;
  } catch (e) {
    return defaultDB();
  }
}

function persist() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(DB));
    return true;
  } catch (e) {
    return false;
  }
}

function saveAndRender() {
  if (!persist()) {
    toast("Không thể lưu dữ liệu vào trình duyệt.", "danger");
    return false;
  }
  renderAll();
  return true;
}

function toast(msg, type = "ok") {
  const box = document.createElement("div");
  box.className = "toast-item";
  box.textContent = msg;
  if (type === "danger") box.classList.add("danger-text");
  if (type === "ok") box.classList.add("success-text");
  document.getElementById("toast").appendChild(box);
  setTimeout(() => box.remove(), 3200);
}

function escapeHTML(s) {
  return String(s ?? "").replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
}

function scoreFromForm() {
  let total = 0;
  const details = [];
  LOIS.forEach((loi, i) => {
    const sl = Math.max(0, Number.parseInt(document.getElementById("sl" + i)?.value || "0", 10) || 0);
    const student = (document.getElementById("ten" + i)?.value || "").trim();
    const point = sl * loi.d;
    total += point;
    const line = document.getElementById("diem" + i);
    if (line) line.textContent = point;
    if (sl > 0) details.push({ rule: loi.n, count: sl, student, point });
  });
  return { total, details };
}

function calc() {
  const result = scoreFromForm();
  const total = document.getElementById("tongPhien");
  const after = document.getElementById("afterScore");
  const current = DB[selectedScoreClass]?.total ?? 100;
  if (total) total.textContent = result.total;
  if (after) after.textContent = current + result.total;
  return result;
}

function renderScore() {
  const lop = selectedScoreClass;
  let html = `<div class="rank-title">📝 SỔ CHẤM ĐIỂM</div>
  <div class="toolbar">
    <label><b>Chọn lớp:</b></label>
    <select id="lopSelect" class="form-control">
      ${LOPS.map(l => `<option value="${l}" ${l === lop ? "selected" : ""}>${l}</option>`).join("")}
    </select>
    <button id="resetScoreBtn" class="btn ghost">Làm mới phiếu</button>
  </div>
  <div class="score-layout"><div>
    <div class="notice">Điểm nền cơ bản của mỗi lớp là <b>100</b>. Nhập số lần vi phạm hoặc thành tích bên dưới:</div>
    <div class="rule-list">`;
  LOIS.forEach((loi, i) => {
    html += `<div class="rule">
      <strong>${escapeHTML(loi.n)} <span class="${loi.d >= 0 ? 'plus' : 'minus'}">(${loi.d > 0 ? '+' : ''}${loi.d})</span></strong>
      <div class="row">
        <input id="ten${i}" type="text" placeholder="Tên HS (nếu có)">
        <input id="sl${i}" type="number" min="0" step="1" value="0">
      </div>
      <div class="muted">Điểm tiêu mục: <span id="diem${i}">0</span></div>
    </div>`;
  });
  html += `</div></div>
  <div class="total-box"><div class="stat">
    <span class="muted">Lớp đang chọn</span><b>${lop}</b>
    <div class="muted">Điểm hiện tại: <span id="currentScore">${DB[lop].total}</span></div>
    <hr>
    <span class="muted">Điểm phiên chấm hôm nay</span>
    <div id="tongPhien" class="big-score">0</div>
    <div class="muted">Điểm sau khi lưu: <b id="afterScore">${DB[lop].total}</b></div>
    <button id="saveWeekBtn" class="btn success" style="width:100%;margin-top:12px;padding:12px">XÁC NHẬN LƯU</button>
  </div></div></div>`;

  document.getElementById("score").innerHTML = html;

  document.getElementById("lopSelect").addEventListener("change", e => {
    selectedScoreClass = e.target.value;
    renderScore();
  });
  document.getElementById("resetScoreBtn").addEventListener("click", () => renderScore());
  document.querySelectorAll("#score input").forEach(el => el.addEventListener("input", calc));
  document.getElementById("saveWeekBtn").addEventListener("click", saveWeek);
  calc();
}

function saveWeek() {
  const lop = selectedScoreClass;
  const c = DB[lop];
  if (!c) { toast("Không tìm thấy lớp.", "danger"); return; }

  const { total, details } = calc();
  const oldTotal = Number(c.total) || 100;
  const newTotal = oldTotal + total;

  const ok = confirm(
    `XÁC NHẬN LƯU ĐIỂM CHẤM\n\n` +
    `Lớp: ${lop}\n` +
    `Điểm phiên: ${total >= 0 ? "+" : ""}${total}\n` +
    `Điểm BXH mới: ${oldTotal} → ${newTotal}`
  );
  if (!ok) return;

  const now = new Date();
  const week = {
    id: "w_" + now.getTime() + "_" + Math.random().toString(36).slice(2, 8),
    date: now.toLocaleDateString("vi-VN") + " " + now.toLocaleTimeString("vi-VN", { hour: '2-digit', minute: '2-digit' }),
    score: total,
    details: details
  };

  c.total = newTotal;
  c.weeks.push(week);
  c.weeksSavedTotal = (Number(c.weeksSavedTotal) || 0) + 1;

  let msg = [];
  if (c.weeksSavedTotal % 4 === 0) {
    const last4 = c.weeks.slice(-4);
    const monthScore = last4.reduce((s, w) => s + Number(w.score || 0), 0);
    c.monthPoint = monthScore;
    c.months.push({
      id: "m_" + now.getTime(),
      date: now.toLocaleDateString("vi-VN"),
      score: monthScore,
      weeks: 4
    });
    c.monthsSavedTotal = (Number(c.monthsSavedTotal) || 0) + 1;
    if (c.months.length > 12) c.months.shift();
    msg.push(`${lop} đủ 4 tuần → Tạo điểm tháng mới (${monthScore}đ).`);

    if (c.monthsSavedTotal % 12 === 0) {
      const last12 = c.months.slice(-12);
      const yearScore = last12.reduce((s, m) => s + Number(m.score || 0), 0);
      c.yearPoint = yearScore;
      c.years.push({
        id: "y_" + now.getTime(),
        date: now.toLocaleDateString("vi-VN"),
        score: yearScore
      });
      if (c.years.length > 5) c.years.shift();
      msg.push(`${lop} đủ 12 tháng → Tạo điểm năm mới (${yearScore}đ).`);
    }
  }

  while (c.weeks.length > 35) c.weeks.shift();

  if (!saveAndRender()) return;

  toast(`Đã lưu ${lop}: ${oldTotal} → ${newTotal} điểm.`, "ok");
  alert(
    `ĐÃ LƯU THÀNH CÔNG!\n\n` +
    `${lop}: ${oldTotal} → ${newTotal} điểm\n` +
    `Cập nhật điểm phiên: ${total >= 0 ? "+" : ""}${total}` +
    `${msg.length ? "\n\n" + msg.join("\n") : ""}`
  );
  showSection("week");
}

function renderStats() {
  const arr = LOPS.map(l => ({ l, score: DB[l].total })).sort((a, b) => b.score - a.score);
  const top = arr[0];
  const weeks = LOPS.reduce((s, l) => s + DB[l].weeks.length, 0);
  const months = LOPS.reduce((s, l) => s + DB[l].months.length, 0);
  document.getElementById("stats").innerHTML = `
    <div class="stat"><span class="muted">🥇 Dẫn đầu tuần</span><b>${top.l}</b><small>${top.score} điểm</small></div>
    <div class="stat"><span class="muted">📅 Lượt chấm tuần</span><b>${weeks}</b><small>Tối đa 35 tuần gần nhất</small></div>
    <div class="stat"><span class="muted">📆 Tháng đã lưu</span><b>${months}</b><small>Tự động chốt mỗi 4 tuần</small></div>
    <div class="stat"><span class="muted">🏆 Lớp quản lý</span><b>${LOPS.length}</b><small>Dữ liệu lưu trên trình duyệt</small></div>`;
}

function renderRank() {
  const arr = [...LOPS].sort((a, b) => DB[b].total - DB[a].total);
  let html = `<div class="rank-title">📊 BẢNG XẾP HẠNG TUẦN</div>
  <div class="toolbar"><input id="weekSearch" placeholder="Tìm kiếm lớp..."><button id="exportWeekBtn" class="btn secondary">⬇ Xuất BXH CSV</button></div>
  <div class="table-wrap"><table id="weekTable"><thead><tr><th>Hạng</th><th>Lớp</th><th>Điểm BXH</th><th>Lượt chấm</th><th>Lịch sử</th></tr></thead><tbody>`;
  arr.forEach((l, i) => {
    html += `<tr><td class="${i === 0 ? 'rank-1' : ''}">${i + 1}</td><td><b>${l}</b></td><td><b>${DB[l].total}</b></td><td>${DB[l].weeks.length} tuần</td><td><button class="btn secondary" data-history="${l}">Xem chi tiết</button></td></tr>`;
  });
  html += `</tbody></table></div>`;
  document.getElementById("week").innerHTML = html;

  document.getElementById("weekSearch").addEventListener("input", e => filterTable("weekTable", e.target.value));
  document.getElementById("exportWeekBtn").addEventListener("click", () => exportRanking("week"));
  document.querySelectorAll("[data-history]").forEach(b => b.addEventListener("click", () => openModal(b.dataset.history)));
}

function renderMonthRank() {
  const arr = [...LOPS].sort((a, b) => (DB[b].monthPoint || 0) - (DB[a].monthPoint || 0));
  let html = `<div class="rank-title">📆 BẢNG XẾP HẠNG THÁNG</div>
  <div class="toolbar"><button id="exportMonthBtn" class="btn secondary">⬇ Xuất BXH tháng</button></div>
  <div class="table-wrap"><table><thead><tr><th>Hạng</th><th>Lớp</th><th>Điểm tháng</th><th>Số tháng đã tích lũy</th></tr></thead><tbody>`;
  arr.forEach((l, i) => html += `<tr><td>${i + 1}</td><td><b>${l}</b></td><td><b>${DB[l].monthPoint || 0}</b></td><td>${DB[l].months.length}/12</td></tr>`);
  html += `</tbody></table></div>`;
  document.getElementById("month").innerHTML = html;
  document.getElementById("exportMonthBtn").addEventListener("click", () => exportRanking("month"));
}

function renderYearRank() {
  const arr = [...LOPS].sort((a, b) => (DB[b].yearPoint || 0) - (DB[a].yearPoint || 0));
  let html = `<div class="rank-title">🏆 BẢNG XẾP HẠNG NĂM</div>
  <div class="toolbar"><button id="exportYearBtn" class="btn secondary">⬇ Xuất BXH năm</button></div>
  <div class="table-wrap"><table><thead><tr><th>Hạng</th><th>Lớp</th><th>Điểm năm</th><th>Số năm tích lũy</th></tr></thead><tbody>`;
  arr.forEach((l, i) => html += `<tr><td>${i + 1}</td><td><b>${l}</b></td><td><b>${DB[l].yearPoint || 0}</b></td><td>${DB[l].years.length}</td></tr>`);
  html += `</tbody></table></div>`;
  document.getElementById("year").innerHTML = html;
  document.getElementById("exportYearBtn").addEventListener("click", () => exportRanking("year"));
}

function openModal(lop) {
  currentClass = lop; currentHistoryTab = "week";
  document.getElementById("modal").classList.remove("hidden");
  document.getElementById("modalTitle").textContent = "Lịch sử chấm điểm: Lớp " + lop;
  renderHistory();
}

function closeModal() { document.getElementById("modal").classList.add("hidden"); }

function renderHistory() {
  const d = DB[currentClass];
  let tabs = `<div class="tabs">
    <button id="tabWeek" class="btn ${currentHistoryTab === 'week' ? 'success' : 'secondary'}">📅 Theo Tuần</button>
    <button id="tabMonth" class="btn ${currentHistoryTab === 'month' ? 'success' : 'secondary'}">📆 Theo Tháng</button>
    <button id="tabYear" class="btn ${currentHistoryTab === 'year' ? 'success' : 'secondary'}">🏆 Theo Năm</button>
  </div>`;
  let body = "";
  if (currentHistoryTab === "week") {
    body = d.weeks.length ? `<div class="table-wrap"><table><tr><th>STT</th><th>Thời gian</th><th>Điểm phiên</th><th>Thao tác</th></tr>${
      d.weeks.map((w, i) => `<tr><td>${i + 1}</td><td>${escapeHTML(w.date)}</td><td><b class="${w.score>=0?'plus':'minus'}">${w.score>=0?'+':''}${w.score}</b></td><td><button class="btn secondary" data-week-detail="${i}">Chi tiết</button></td></tr>`).join("")
    }</table></div>` : `<div class="empty">Chưa có lịch sử chấm điểm cho lớp này.</div>`;
  } else if (currentHistoryTab === "month") {
    body = d.months.length ? `<div class="table-wrap"><table><tr><th>STT</th><th>Ngày chốt</th><th>Điểm tháng</th></tr>${
      d.months.map((m, i) => `<tr><td>${i + 1}</td><td>${escapeHTML(m.date)}</td><td><b>${m.score}</b></td></tr>`).join("")
    }</table></div>` : `<div class="empty">Chưa chốt dữ liệu tháng.</div>`;
  } else {
    body = d.years.length ? `<div class="table-wrap"><table><tr><th>STT</th><th>Ngày chốt</th><th>Điểm năm</th></tr>${
      d.years.map((y, i) => `<tr><td>${i + 1}</td><td>${escapeHTML(y.date)}</td><td><b>${y.score}</b></td></tr>`).join("")
    }</table></div>` : `<div class="empty">Chưa chốt dữ liệu năm.</div>`;
  }

  document.getElementById("modalBody").innerHTML = tabs + body;
  document.getElementById("tabWeek").addEventListener("click", () => { currentHistoryTab = "week"; renderHistory(); });
  document.getElementById("tabMonth").addEventListener("click", () => { currentHistoryTab = "month"; renderHistory(); });
  document.getElementById("tabYear").addEventListener("click", () => { currentHistoryTab = "year"; renderHistory(); });
  document.querySelectorAll("[data-week-detail]").forEach(b => b.addEventListener("click", () => showWeekDetail(Number(b.dataset.weekDetail))));
}

function showWeekDetail(i) {
  const w = DB[currentClass]?.weeks?.[i];
  if (!w) return;
  const details = Array.isArray(w.details) ? w.details : [];
  let h = `<h3>Chi tiết buổi chấm: Lớp ${escapeHTML(currentClass)} (${escapeHTML(w.date)})</h3>`;
  if (!details.length) {
    h += `<div class="notice">Phiếu chấm này không ghi nhận lỗi vi phạm hoặc điểm cộng nào.</div>`;
  } else {
    h += `<div class="table-wrap"><table><tr><th>Nội dung</th><th>Học sinh</th><th>Số lần</th><th>Điểm tổng</th></tr>`;
    details.forEach(x => {
      h += `<tr><td style="text-align:left">${escapeHTML(x.rule)}</td><td>${escapeHTML(x.student || "—")}</td><td>${Number(x.count) || 0}</td><td><b class="${x.point>=0?'plus':'minus'}">${x.point>=0?'+':''}${Number(x.point)||0}</b></td></tr>`;
    });
    h += `</table></div>`;
  }
  h += `<br><button id="backHistoryBtn" class="btn secondary">← Quay lại danh sách</button>`;
  document.getElementById("modalBody").innerHTML = h;
  document.getElementById("backHistoryBtn").addEventListener("click", renderHistory);
}

function renderTools() {
  document.getElementById("tools").innerHTML = `
    <div class="rank-title">🧰 Trung tâm quản trị & Tiện ích</div>
    <div class="grid">
      <div class="stat"><b>💾 Sao lưu dữ liệu</b><p class="muted">Tải file lưu trữ JSON về máy để phòng ngừa sự cố.</p><button id="backupBtn" class="btn success">Tải file sao lưu (.JSON)</button></div>
      <div class="stat"><b>📥 Khôi phục dữ liệu</b><p class="muted">Tải lên file JSON đã sao lưu để phục hồi.</p><input id="restoreFile" type="file" accept=".json"></div>
      <div class="stat"><b>📊 Xuất báo cáo Excel</b><p class="muted">Xuất toàn bộ bảng điểm ra file CSV mở bằng Excel.</p><button id="exportAllBtn" class="btn">Xuất CSV toàn bộ</button></div>
      <div class="stat"><b>🧹 Reset hệ thống</b><p class="muted">Xóa toàn bộ điểm số để bắt đầu năm học mới.</p><button id="resetAllBtn" class="btn danger">Xóa tất cả dữ liệu</button></div>
    </div>
    <div class="card" style="background:#0f172a;margin-top:15px">
      <h3>🔎 Kiểm tra cấu trúc dữ liệu</h3>
      <p>Tổng số lớp: <b>${LOPS.length}</b> | Tổng lượt chấm tuần: <b>${LOPS.reduce((s, l) => s + DB[l].weeks.length, 0)}</b></p>
      <button id="integrityBtn" class="btn secondary">Đồng bộ & Sửa lỗi dữ liệu</button>
    </div>`;
  document.getElementById("backupBtn").addEventListener("click", backupJSON);
  document.getElementById("restoreFile").addEventListener("change", restoreJSON);
  document.getElementById("exportAllBtn").addEventListener("click", exportAllCSV);
  document.getElementById("resetAllBtn").addEventListener("click", resetAll);
  document.getElementById("integrityBtn").addEventListener("click", runIntegrityCheck);
}

function exportAllCSV() {
  const rows = [["Lớp", "Điểm hiện tại", "Số tuần đã lưu", "Điểm tháng", "Điểm năm"]];
  LOPS.forEach(l => rows.push([l, DB[l].total, DB[l].weeks.length, DB[l].monthPoint, DB[l].yearPoint]));
  downloadBlob(new Blob(["\uFEFF" + rows.map(r => r.map(csvCell).join(",")).join("\n")], { type: "text/csv;charset=utf-8" }), "SAODO_PHUOCAN_TongHop.csv");
}

function exportRanking(type) {
  let arr = [...LOPS], header, rows;
  if (type === "week") {
    arr.sort((a, b) => DB[b].total - DB[a].total);
    header = ["Hạng", "Lớp", "Điểm Tuần", "Số Lượt Chấm"];
    rows = arr.map((l, i) => [i + 1, l, DB[l].total, DB[l].weeks.length]);
  } else if (type === "month") {
    arr.sort((a, b) => (DB[b].monthPoint || 0) - (DB[a].monthPoint || 0));
    header = ["Hạng", "Lớp", "Điểm Tháng", "Số Tháng Tích Lũy"];
    rows = arr.map((l, i) => [i + 1, l, DB[l].monthPoint || 0, DB[l].months.length]);
  } else {
    arr.sort((a, b) => (DB[b].yearPoint || 0) - (DB[a].yearPoint || 0));
    header = ["Hạng", "Lớp", "Điểm Năm", "Số Năm Tích Lũy"];
    rows = arr.map((l, i) => [i + 1, l, DB[l].yearPoint || 0, DB[l].years.length]);
  }
  downloadBlob(new Blob(["\uFEFF" + [header, ...rows].map(r => r.map(csvCell).join(",")).join("\n")], { type: "text/csv;charset=utf-8" }), "BXH_" + type + "_" + dateStamp() + ".csv");
}

function backupJSON() {
  downloadBlob(new Blob([JSON.stringify(DB, null, 2)], { type: "application/json" }), "SAODO_PHUOCAN_Backup_" + dateStamp() + ".json");
}

function restoreJSON(ev) {
  const file = ev.target.files?.[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const incoming = JSON.parse(reader.result);
      if (!incoming || typeof incoming !== "object") throw new Error();
      if (!confirm("Khôi phục dữ liệu sẽ ghi đè lên toàn bộ dữ liệu hiện tại. Tiếp tục?")) return;
      const newDB = defaultDB();
      LOPS.forEach(l => newDB[l] = migrateClass(incoming[l]));
      DB = newDB;
      if (saveAndRender()) alert("Khôi phục dữ liệu thành công!");
    } catch (e) {
      alert("Tệp JSON không đúng định dạng!");
    } finally {
      ev.target.value = "";
    }
  };
  reader.readAsText(file);
}

function runIntegrityCheck() {
  LOPS.forEach(l => {
    DB[l] = migrateClass(DB[l]);
    while (DB[l].weeks.length > 35) DB[l].weeks.shift();
    if (!Array.isArray(DB[l].months)) DB[l].months = [];
    if (!Array.isArray(DB[l].years)) DB[l].years = [];
  });
  if (saveAndRender()) alert("Đã hoàn tất đồng bộ và chuẩn hóa bộ nhớ!");
}

function resetAll() {
  if (!confirm("CẢNH BÁO: Hành động này sẽ XÓA HẲN toàn bộ điểm số của tất cả các lớp!")) return;
  if (!confirm("Xác nhận lần 2: Bạn có chắc chắn muốn xóa không?")) return;
  DB = defaultDB();
  if (saveAndRender()) alert("Hệ thống đã được đặt lại về trạng thái ban đầu.");
}

function downloadBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function csvCell(v) { return `"${String(v ?? "").replaceAll('"', '""')}"`; }
function dateStamp() { return new Date().toISOString().slice(0, 10); }
function filterTable(id, q) {
  const term = (q || "").toLowerCase();
  document.querySelectorAll("#" + id + " tbody tr").forEach(tr => tr.style.display = tr.innerText.toLowerCase().includes(term) ? "" : "none");
}

function showSection(id) {
  document.querySelectorAll(".section").forEach(x => x.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  if (id === "week") renderRank();
  if (id === "month") renderMonthRank();
  if (id === "year") renderYearRank();
  if (id === "score") renderScore();
  if (id === "tools") renderTools();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function renderAll() {
  renderStats();
  renderRank();
  renderMonthRank();
  renderYearRank();
  const active = document.querySelector(".section.active")?.id;
  if (active === "score") renderScore();
  if (active === "tools") renderTools();
}

function logout() {
  sessionStorage.removeItem("SAODO_AUTH_STABLE");
  document.getElementById("app").classList.add("hidden");
  document.getElementById("login").classList.remove("hidden");
  document.getElementById("pin").value = "";
  document.getElementById("loginMsg").textContent = "";
  window.scrollTo(0, 0);
}

function unlock() {
  sessionStorage.setItem("SAODO_AUTH_STABLE", "1");
  document.getElementById("login").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  renderAll();
}

document.querySelectorAll("[data-section]").forEach(btn => btn.addEventListener("click", () => showSection(btn.dataset.section)));
document.getElementById("logoutBtn").addEventListener("click", logout);
document.getElementById("closeModalBtn").addEventListener("click", closeModal);
document.getElementById("modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });

const pinInput = document.getElementById("pin");
function handlePinInput() {
  const msg = document.getElementById("loginMsg");
  if (this.value === PIN) {
    pinInput.value = "";
    unlock();
  } else if (this.value.length >= 4) {
    msg.textContent = "Mã PIN không đúng!";
  } else {
    msg.textContent = "";
  }
}
pinInput.addEventListener("input", handlePinInput);

if (sessionStorage.getItem("SAODO_AUTH_STABLE") === "1") unlock();
else renderAll();

window.addEventListener("storage", e => {
  if (e.key === STORAGE_KEY) {
    DB = loadDB();
    renderAll();
  }
});
</script>
</body>
</html>
